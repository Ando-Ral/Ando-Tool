name: Build Ando Tool Carnet for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --clean --noconfirm --onefile --windowed --name AndoToolCarnet main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AndoToolCarnet-Windows
          path: dist/AndoToolCarnet.exe
